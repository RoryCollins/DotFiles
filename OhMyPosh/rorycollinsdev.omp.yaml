# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
    black: '#33395b'
    blue: '#359ddd'
    darkgreen: '#277b48'
    darkred: '#7c0a16'
    lightgreen: '#85C980'
    orange: '#ff972e'
    red: '#de3142'
    white: '#efeef4'
secondary_prompt:
    template: ' '
    foreground: p:white
    background: transparent
transient_prompt:
    template: ' '
    foreground: p:white
    background: transparent
console_title_template: '{{.PWD}}'
blocks:
    - type: prompt
      alignment: left
      segments:
        - properties:
            folder_icon: ..
            home_icon: ' '
            mapped_locations:
                C:\Users\Rory.Collins\Source: "\U000F0169 "
            style: agnoster
          leading_diamond: 
          template: '   {{ .Path }} '
          foreground: p:white
          powerline_symbol: 
          background: p:black
          type: path
          style: diamond
        - properties:
            branch_icon: ' '
            fetch_status: true
            fetch_upstream_icon: true
            fetch_user: true
            source: cli
          template: ' {{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
          foreground: p:white
          powerline_symbol: 
          background: p:darkgreen
          type: git
          style: powerline
        - properties:
            always_enabled: true
            style: round
          trailing_diamond: 
          template: " \U000F051F {{ .FormattedMs }} "
          foreground: p:white
          powerline_symbol: 
          background: p:darkred
          type: executiontime
          style: diamond
    - type: prompt
      alignment: right
      segments:
        - properties:
            fetch_user: true
          template: '{{.User.Email}} '
          foreground: p:darkgreen
          background: transparent
          type: git
          style: diamond
        - template: 'RAM:{{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB '
          foreground: p:lightgreen
          background: transparent
          type: sysinfo
          style: diamond
    - type: prompt
      alignment: left
      segments:
        - template: ╰─
          foreground: p:white
          type: text
          style: plain
        - properties:
            always_enabled: true
          template: ' '
          foreground: p:white
          type: status
          style: plain
      newline: true
version: 3
final_space: true
